<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phishing URL Detector</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md text-center">
        <div class="mb-6">
            <h1 class="text-3xl font-extrabold text-gray-800">URL Scanner</h1>
            <p class="text-sm text-gray-500 mt-2">Detect potential phishing links</p>
        </div>
        
        <input type="text" id="urlInput" placeholder="Enter URL (e.g., http://example.com)" 
               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4 transition">
        
        <button onclick="checkUrl()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition duration-300 shadow-md">
            Analyze URL
        </button>
        
        <!-- Name placement as requested -->
        <p class="text-xs text-gray-400 mt-5 tracking-wide uppercase">Developed by Prithvi Chauhan</p>
        
        <div id="result" class="mt-6 hidden p-5 rounded-lg text-left shadow-inner">
            <!-- JavaScript will inject results here -->
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
